{% extends "base.html" %}
{% block title %}Renvoyer la confirmation — RelanceFacile{% endblock %}
{% block content %}
<div class="form-card">
    <h1>Renvoyer le lien de confirmation</h1>
    <p class="muted">Entre l'email utilisé à l'inscription, on te renvoie un nouveau lien s'il n'est pas encore confirmé.</p>
    <form method="POST" novalidate>
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <button type="submit" class="btn-primary">Renvoyer le lien</button>
    </form>
    <p><a href="{{ url_for('login') }}">Retour à la connexion</a></p>
</div>
{% endblock %}
